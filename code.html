<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse the NEXUS dbt project: models, macros, tests, snapshots, scripts and CI, with each model's build cost.">
  <title>dbt Project | NEXUS by VIM</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/site.css?v=9">
  <link rel="stylesheet" href="assets/code.css?v=5">
  <link rel="stylesheet" href="assets/highlight.css?v=1">
  <script src="assets/highlight.js?v=2" defer></script>
  <script src="assets/code.js?v=7" defer></script>
</head>
<body class="view-page code-page">
  <main class="code-browser" aria-label="Project source">
    <aside class="code-tree" aria-label="Files">
      <label class="visually-hidden" for="code-filter">Filter files</label>
      <input id="code-filter" class="code-filter" type="search" placeholder="Filter files or code…" autocomplete="off">
      <nav id="code-files">Loading files…</nav>
    </aside>
    <section class="code-view" aria-live="polite">
      <div class="code-head"><div><span id="code-folder" class="code-folder"></span><strong id="code-path">Select a file</strong></div><div class="code-actions" id="code-actions"></div></div>
      <div class="code-meta" id="code-meta" hidden></div>
      <div class="code-cost" id="code-cost" hidden></div>
      <pre class="code-body"><code id="code-text"></code></pre>
      <div class="code-overview" id="code-overview" hidden></div>
    </section>
  </main>
</body>
</html>
