version: 2

models:
  - name: int_submission_lifecycle
    description: Review attempts ordered within each title. One row per submission.
    columns:
      - name: submission_id
        data_tests: [unique, not_null]
      - name: review_hours
        data_tests:
          - non_negative
  - name: int_partner_review_features
    description: One row per submission with partner review history available at submission time. The current review duration remains the observed label.
    columns:
      - name: submission_id
        data_tests: [unique, not_null]
      - name: prior_partner_review_count
        data_tests:
          - non_negative
  - name: int_title_outcomes
    description: One row per title; submission and publication streams are aggregated separately before joining to prevent fanout.
    columns:
      - name: title_id
        data_tests: [unique, not_null]
      - name: publication_lead_days
        data_tests:
          - non_negative
  - name: int_title_publication_features
    description: One row per approved title. Partner history includes only titles published strictly before the current approval; publication is an observed outcome.
    columns:
      - name: title_id
        data_tests: [unique, not_null]
      - name: prior_partner_published_titles
        data_tests:
          - non_negative
      - name: observed_handoff_hours
        data_tests:
          - non_negative
