<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The NEXUS Airflow DAG in an Airflow-style view: grid of runs, graph, code and task logs, replaying a recorded run.">
  <title>Airflow DAG | NEXUS by VIM</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300..900;1,300..900&display=swap">
  <link rel="stylesheet" href="assets/fonts.css?v=1">
  <link rel="stylesheet" href="assets/highlight.css?v=2">
  <link rel="stylesheet" href="assets/airflow.css?v=8">
  <script src="assets/highlight.js?v=2" defer></script>
  <script src="assets/airflow.js?v=8" defer></script>
</head>
<body class="afu">
  <nav class="afu-nav" aria-label="Airflow navigation">
    <span class="afu-logo" title="Airflow (hypothetical)"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 16 L16 3 C21 3 25 7 25 11 Z" fill="#017cee"/><path d="M16 16 L29 16 C29 21 25 25 21 25 Z" fill="#00ad46"/><path d="M16 16 L16 29 C11 29 7 25 7 21 Z" fill="#e43921"/><path d="M16 16 L3 16 C3 11 7 7 11 7 Z" fill="#ffc80a"/></svg></span>
    <button type="button" class="afu-navitem is-active" data-section="dags" title="Dags">◫<small>Dags</small></button>
    <button type="button" class="afu-navitem" data-section="code" title="Airflow project code">&lt;/&gt;<small>Code</small></button>
    <button type="button" class="afu-navitem" data-section="assets" title="Assets this DAG updates">◇<small>Assets</small></button>
    <button type="button" class="afu-navitem" data-section="docs" title="Airflow README">☰<small>Docs</small></button>
  </nav>
  <main class="afu-main" id="afu-dags-section">
    <div class="afu-crumbs"><span>Dags</span><b>›</b><strong id="afu-dag-crumb">nexus_partner_analytics</strong><em class="afu-demo">Hypothetical · replays a recorded run · nothing executes in your browser</em></div>
    <header class="afu-head">
      <div class="afu-title">
        <span class="afu-toggle" title="DAG is unpaused"><i></i></span>
        <h1 id="afu-dag">nexus_partner_analytics</h1>
        <div class="afu-tags" id="afu-tags"></div>
      </div>
      <div class="afu-actions">
        <label class="afu-opt"><input type="checkbox" id="afu-fail"> Fail the test gate</label>
        <label class="afu-opt">Speed <select id="afu-speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="12">12×</option></select></label>
        <button type="button" class="afu-trigger" id="afu-trigger"><span aria-hidden="true">▶</span> Trigger</button>
      </div>
    </header>
    <dl class="afu-facts" id="afu-facts"></dl>
    <div class="afu-tabs" role="tablist" aria-label="DAG views">
      <button type="button" role="tab" data-tab="overview" aria-selected="false">Overview</button>
      <button type="button" role="tab" data-tab="grid" aria-selected="true">Grid</button>
      <button type="button" role="tab" data-tab="graph" aria-selected="false">Graph</button>
      <button type="button" role="tab" data-tab="code" aria-selected="false">Code</button>
      <button type="button" role="tab" data-tab="details" aria-selected="false">Details</button>
    </div>
    <div class="afu-body">
      <section class="afu-pane" id="afu-pane" aria-live="polite"></section>
      <aside class="afu-panel" id="afu-panel" aria-live="polite"></aside>
    </div>
  </main>
  <main class="afu-main afu-section" id="afu-section" hidden></main>
</body>
</html>
