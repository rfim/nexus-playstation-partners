name: nexus_partner_analytics
version: 1.0.0
config-version: 2
profile: nexus_partner_analytics

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  nexus_partner_analytics:
    # Governance: every model has an owning group, an access level and a data
    # classification. Public models are the consumer interface; the most-read
    # ones also carry enforced contracts in models/marts/properties.yml.
    staging:
      +materialized: view
      +group: data_platform
      +access: protected
      +meta:
        classification: internal
    intermediate:
      +materialized: view
      +group: data_platform
      +access: protected
      +meta:
        classification: internal
    platform:
      +materialized: table
      +group: platform_ops
      +access: protected
      +meta:
        classification: internal
      cost_warehouse_daily:
        +materialized: view
    marts:
      +materialized: table
      +group: partner_analytics
      +access: public
      +meta:
        classification: partner_confidential

vars:
  # Platform cost: a fixed mid-month clock so the run-rate forecast has something to forecast.
  cost_as_of_date: '2026-09-24'
  # Illustrative on-demand price per credit; real contracts differ.
  credit_price_usd: 3.0
  # A warehouse-day is anomalous above this multiple of its trailing seven-day average.
  cost_anomaly_ratio: 2.0
  # Fixed clock for the synthetic opportunity marts, so the exported site data stays deterministic.
  opportunity_as_of_date: '2026-09-30'
  # A partner with fewer submitted titles is shown with its bounds and flagged, never ranked.
  health_min_titles: 5
  # Days without a submission after which the recency component of partner health reaches zero.
  health_recency_window_days: 60
